# STAGE's /stage command bundle patch. Applied when this package is a profile
# bundle: one row inserting the host-only command plugin that registers the
# `/stage` and `/stage-auto` slash commands. The plugin is a zero-dependency
# shim — the routing logic lives in <project>/.agents/commands/stage.md, the
# goal-run procedure in stage-auto.md beside it, and the skills they start live
# in <project>/.dsh/skills/, all discovered relative to the project dsh is
# launched in.
- insert:
    - id: stage
      name: 'stage'
