name: STAGE consistency

on:
  push:
    branches: [main]
  pull_request:

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run consistency checks
        run: bash .github/scripts/check_consistency.sh

  # The template's flagship claim — a fresh checkout compiles out of the box,
  # and the first lint fails red on exactly the one demonstration \todo — is
  # verified here rather than by hand. A regression in stage.cls, stage.sty, or
  # main.tex would otherwise ship silently: the consistency job never compiles.
  build:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build out of the box
        run: bash execs/run.sh
      - name: Lint fails on exactly the demonstration todo
        run: |
          out="$(bash execs/scpts/lint.sh)" && rc=0 || rc=$?
          printf '%s\n' "${out}"
          if [ "${rc}" -eq 0 ]; then
            echo "lint passed on a fresh tree — the demonstration todo in manus/main.tex is gone"
            exit 1
          fi
          printf '%s\n' "${out}" | grep -qF 'FAIL: 1 todo marker(s)' || {
            echo "lint failed for a reason other than the one demonstration todo"
            exit 1
          }
          printf '%s\n' "${out}" | grep -qF 'ok: no undefined citations' || {
            echo "the fresh build has undefined citations or references"
            exit 1
          }
