# STAGE hooks for Kimi Code — registration snippet.
#
# One hook: the project-memory index injected from .stage/memory/ at the start
# of a session.
#
# EASIEST: run `bash .kimi-code/hooks/install.sh` once — it writes the block
# below into your global config for you (idempotent, backs up first). The manual
# route below is the same thing by hand.
#
# Kimi does not auto-load project-level config, so this cannot live in the repo
# the way .claude/settings.json, .codex/hooks.json, and .cursor/hooks.json do.
# To enable it manually, copy the [[hooks]] block below into your GLOBAL Kimi
# config at $KIMI_CODE_HOME/config.toml (default ~/.kimi-code/config.toml). The
# relative command path works because Kimi runs hook commands with the working
# directory set to the session's project root, so it resolves to each STAGE
# paper repository's own copy — one global entry then serves every STAGE project
# with no per-project editing, and in a non-STAGE session the path is simply
# absent and the hook no-ops (fail-open). If your Kimi build does not resolve
# relative hook paths, replace `command` with the ABSOLUTE path to this repo's
# script (which must then be edited per project).
#
# Why UserPromptSubmit rather than SessionStart: in Kimi, SessionStart is
# fire-and-forget and cannot inject context. UserPromptSubmit is the only
# context-appending event. The hook injects once per session (keyed on
# session_id), so it does not repeat every turn.
#
# Note: [[hooks]] accepts only event / matcher / command / timeout — any extra
# field makes the whole config fail to load.

[[hooks]]
event = "UserPromptSubmit"
command = ".kimi-code/hooks/stage_memory.sh"
timeout = 10
